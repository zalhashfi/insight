# nodrix deploy carrier. The Deploy to Cloudflare button clones only this subdir;
# the build command pulls the real source from upstream over it and rebuilds the
# deployment's wrangler.toml from this file, keeping only its Worker name,
# account, routes, resource IDs and vars. Everything else here reaches every
# existing deployment on its next build — keep it in sync with the root config.
name = "insight"
main = "worker/src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# Pulls the latest nodrix release and builds it over this clone.
# Set NODRIX_DEPLOY_CHANNEL=edge in build vars to track the default branch.
[build]
command = "curl -fsSL https://raw.githubusercontent.com/zalhashfi/insight/master/scripts/build-from-upstream.sh | bash"

# run_worker_first is required: without it the SPA fallback serves index.html for
# unmatched GETs before the Worker runs, swallowing OAuth callbacks.
[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "insight-db"
database_id = "PLACEHOLDER_FILLED_BY_DEPLOY_OR_WRANGLER"
migrations_dir = "worker/src/platform/db/migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "insight-telemetry"

[[kv_namespaces]]
binding = "KV"
id = "PLACEHOLDER_FILLED_BY_DEPLOY_OR_WRANGLER"

[[durable_objects.bindings]]
name = "PROJECT_DO"
class_name = "ProjectDO"

[[durable_objects.bindings]]
name = "DASHBOARD_DO"
class_name = "DashboardDO"

[[durable_objects.bindings]]
name = "SCHEDULER_DO"
class_name = "SchedulerDO"

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "InsightMcpAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProjectDO", "DashboardDO", "SchedulerDO", "InsightMcpAgent"]

[[workflows]]
name = "insight-provision"
binding = "PROVISION"
class_name = "Provision"

# Polled by Settings → Version & updates to flag new releases. Override for forks.
[vars]
INSIGHT_UPSTREAM_REPO = "zalhashfi/insight"
INSIGHT_AGENT_REPO = "zalhashfi/insight-agent"

# Daily anonymous usage-stats heartbeat disabled.
# [triggers]
# crons = ["0 0 * * *"]

[observability]
enabled = true
